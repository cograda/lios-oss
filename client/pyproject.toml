[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "comar-client"
dynamic = ["version"]
description = "Comar (Co-Managed Archive) — local side-car daemon: vault watcher, Apple Reminders dispatch via EventKit, Apple Health push"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "mcp>=1.0",
    "watchdog>=4.0",
    "uvicorn[standard]>=0.30",
    "starlette>=0.37",
    "tomli>=2.0; python_version < '3.11'",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "packaging>=23.0",
    "pyobjc-framework-EventKit>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
comar = "comar.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.version]
path = "src/comar/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/comar"]

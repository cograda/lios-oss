name: process_meeting
title: "Process Meeting"
description: "Process a meeting transcript or conversation recording into a structured meeting note"
arguments:
  - name: transcript
    description: "The meeting transcript, file path, or description of the meeting"
    required: true
messages:
  - role: user
    content: |
      Process this meeting transcript or conversation recording.

      {{ transcript }}

      ## Step 1 — Parse the transcript

      Extract structured data from the transcript. Return:

      - **title**: Meeting title
      - **date**: YYYY-MM-DD
      - **participants**: list of people present
      - **type**: planning | review | medical | school | renovation | financial | general
      - **summary**: 2-4 sentences
      - **topics**: list of topic headings with key points under each
      - **action_items**: list with owner, task description, and priority (high/medium/low)
      - **follow_ups**: next steps, things to chase
      - **corrections**: any transcription errors on proper nouns (e.g. Malahide not Malahyde, Finn not Fin)
      - **new_people**: people mentioned who may not yet have a note in People/

      Parsing rules:
      - Strip small talk and filler
      - Preserve nuance, candour, and specific numbers
      - Attribute opinions and commitments to people
      - Flag transcription errors on proper nouns
      - For Alex/Sam conversations: focus on decisions, commitments, and unresolved items

      ## Step 2 — Create meeting note

      Save to `vault/Meetings/YYYY-MM-DD Topic.md` using `vault_write`:

      ```markdown
      ---
      date: YYYY-MM-DD
      type: meeting
      participants:
        - "[[Person 1]]"
        - "[[Person 2]]"
      tags: [meeting, type-tag]
      ---

      # Meeting Title — D Month YYYY

      **Participants:** [[Person 1]], [[Person 2]]

      ## Summary

      Summary text.

      ## Notes

      ### Topic 1

      - Key point
        - Sub-detail

      ## Action Items

      - [ ] **Alex:** Task description ⏫
      - [ ] **Sam:** Task description 🔼

      ## Follow-ups

      - Next steps
      ```

      ## Step 3 — Update daily note

      If today's daily note exists for Alex (check with `vault_read` at `vault/Daily Notes/Alex/YYYY-MM-DD.md`):
      - Add meeting link under `## Meetings` using `vault_edit`
      - Add the user's action items to Active section

      ## Step 4 — Update backlog

      For significant or recurring action items:
      - Read the relevant backlog with `vault_read`
      - Add to `vault/Task Backlog.md` (shared) or personal backlog as appropriate using `vault_edit`
      - Add waiting-on items to the Waiting On section
      - Don't duplicate — check if the task already exists

      ## Step 5 — Create entity notes

      For people in new_people:
      - Create `vault/People/Person Name.md` with basic frontmatter using `vault_write`:
        ```markdown
        ---
        title: "Person Name"
        type: note
        created: YYYY-MM-DD
        modified: YYYY-MM-DD
        tags: [person]
        ---

        # Person Name

        Met via: [context from meeting]
        ```
      - Ask the user for context if the role isn't clear from the transcript

      ## Step 6 — Show summary

      Display: what was created, key action items, and any entities that need attention.

name: add_task
title: "Add Task"
description: "Add a task to the appropriate backlog with correct priority, domain, action-type, and formatting"
arguments:
  - name: task
    description: "The task to add (e.g. 'book Finn swimming for summer', 'urgently call the plumber about the leak')"
    required: true
messages:
  - role: user
    content: |
      Add a task to the appropriate backlog.

      Task: {{ task }}

      ## Steps

      1. Parse the task from the input. If no task provided, ask what the task is.

      2. Determine which backlog:
         - Clearly personal to Alex -> `vault/Alex/Task Backlog.md`
         - Clearly personal to Sam -> `vault/Sam/Task Backlog.md`
         - Otherwise -> `vault/Task Backlog.md` (shared, default)

      3. Determine priority from context:
         - 🔺 Urgent — needs doing today/tomorrow ("urgently", "today", "asap")
         - ⏫ High — this week ("by Friday", "this week")
         - 🔼 Medium — planned (default if no signal)
         - 🔽 Low — nice to have ("when I get time", "someday-ish")

      4. Determine **domain tag** (one). Match against existing tags in use: `#finance`, `#home`, `#vehicle`, `#medical`, `#school`, `#renovation`, `#kids`, `#household`. Skip if nothing fits — don't invent one.

      5. Determine **action-type tag** (one — required if you can tell). This matches the task to energy/time:
         - `#quick` — <15 min, fire-and-forget (call, form, payment)
         - `#errand` — out-of-house physical task (collect, drop off, drive)
         - `#admin` — paperwork, bills, online forms, scheduling — desk-bound but rote
         - `#schedule` — book an appointment or set up a meeting
         - `#deep` — needs a focused block (research, decisions, writing)
         - `#review` — read or review something (doc, quote, contract)

      6. **Status tag** (optional, only if explicitly signalled):
         - `#blocked` if the input says it's waiting on something
         - `#waiting` if it's effectively delegated (Sam will do it, the plumber will get back, etc.)
         - Don't add `#focus` here — that's set at morning triage

      7. Determine the section in the target backlog. Read the file with `vault_read` and find the best-matching section heading. If none fits, add under the most relevant existing section. Don't add to the top or bottom blindly.

      8. Parse due date if mentioned. Convert relative dates to absolute (YYYY-MM-DD).

      9. Format the task. Order: text → priority → domain → action-type → status → date.
         ```markdown
         - [ ] Task description 🔺 #domain #action-type 📅 2026-04-15
         ```
         Only include the date emoji (📅) if a due date was specified or implied.

      10. Use `[[wiki links]]` for people and projects in the task text.

      11. Insert the task under the right section using `vault_edit`.

      12. Show what was added and where.

      ## Examples

      - "book Finn's swimming for summer" → shared backlog, Kids section
        `- [ ] Book [[Finn]] swimming lessons for summer term 🔼 #school #schedule`

      - "write up solar panel research" → Alex backlog, Side Projects
        `- [ ] Write up solar panel research 🔼 #deep`

      - "NCT by end of April" → shared backlog, Vehicle & Home
        `- [ ] Car NCT 🔼 #vehicle #schedule 📅 2026-04-30`

      - "urgently call the plumber about the leak" → shared backlog, Household
        `- [ ] Call plumber about the leak 🔺 #home #quick`

      - "drop the kids' uniforms back to the school office" → shared backlog, Kids
        `- [ ] Drop uniforms back to school office 🔼 #school #errand`

      - "waiting on Sam to confirm the site meeting time" → shared backlog, Renovation
        `- [ ] Confirm site meeting time with [[Sam]] 🔼 #renovation #waiting`

name: finalize_week
title: "Finalise Week"
description: "Finalise the weekly review with personal commentary and plan next week"
arguments:
  - name: commentary
    description: "Voice transcript, dictated notes, or written commentary on the week"
    required: false
messages:
  - role: user
    content: |
      Finalise the weekly review with personal commentary and plan next week.

      {{ commentary }}

      Run this after the weekly_review prompt. The draft review should already exist.

      ## Steps

      ### 1. Find the draft review

      Read the most recent file in `vault/Weekly Reviews/YYYY/` using `vault_list` and `vault_read` (the one created by the weekly_review prompt).

      If no draft exists, tell the user to run the weekly_review prompt first.

      ### 2. Process commentary

      The commentary argument may contain:
      - **Voice transcript / dictated notes**: Parse it, extract the perspective and priorities
      - **Written notes**: Use directly
      - **Nothing**: Ask what they thought of the week — what went well, what didn't, what's important for next week

      Merge commentary into the review:
      - First person, conversational tone (Alex's voice)
      - Weight by what's strategically important
      - Keep it concise — add perspective, don't bloat

      Update the saved review file with the merged version using `vault_write`.

      ### 3. Gather next week data

      Call these MCP tools:

      - `calendar_list_events` — for the next 7 days
      - `reminders_list` — all current reminders

      Also read using `vault_read`:
      - All three backlogs: `vault/Task Backlog.md`, `vault/Alex/Task Backlog.md`, `vault/Sam/Task Backlog.md`
      - Current week's daily notes for uncompleted carried items

      ### 4. Plan next week

      Process all the raw data to plan next week:

      **Calendar** — apply filtering rules:
      - `alex@example.com`: show full detail
      - `user@work.com`: show as "(busy)" blocks
      - `nana@example.com`: exclude entirely (extended-family calendar, managed separately)

      **Tasks** — extract all open items from backlogs, grouped by priority.

      **Carried items** — from the current week's daily notes, what's still uncompleted?

      **Reminder sync** — compare reminders with high-priority backlog items and next week's plan. Flag:
      - High-priority tasks without reminders
      - Reminders that are done or no longer relevant
      - Focus suggestions for Monday's daily note

      Produce: next week's calendar day-by-day, all open high-priority tasks (urgent and high), carried items, and reminder sync gaps.

      ### 5. Present the week ahead

      Show a day-by-day preview of next week with:
      - Calendar events
      - Suggested focus areas based on priorities, deadlines, and what carried over
      - Any days that look particularly busy or light

      Present the reminder sync gaps and ask the user which to action.

      ### 6. Execute

      For approved actions:
      - Update backlogs (re-prioritise, move completed to Done, delete stale) using `vault_edit`
      - Create/complete reminders via the `reminders_add` and `reminders_complete` MCP tools
      - Pre-populate Monday's daily note Active section if the user wants using `vault_edit`

      ### 7. Close out

      Summarise what was done:
      - Review finalised and saved
      - Backlog changes made
      - Reminders synced
      - Ready for Monday

      Keep it brief and positive.

name: import_finance
title: "Import Finance"
description: "Import CSV bank statements — auto-detects bank and account from file content"
arguments:
  - name: path
    description: "Path to CSV file or directory (default: ~/Desktop/Finance/)"
    required: false
  - name: filter
    description: "Optional filter: 'aib' or 'revolut'"
    required: false
messages:
  - role: user
    content: |
      Import CSV bank statements into the finance system.

      Path: {{ path }}
      Filter: {{ filter }}

      ## Process

      ### Step 1 — Find CSVs

      1. If a path was provided, use that (file or directory)
      2. Otherwise scan `~/Desktop/Finance/` for CSV files
      3. Fallback: check `server/csv-inbox/`

      If no CSVs found, tell the user to drop bank statement CSVs into `~/Desktop/Finance/`.

      If a filter was provided (e.g. "aib" or "revolut"), only process matching files.

      ### Step 2 — Import each file

      For each CSV:
      1. Read the full file content
      2. Call `finance_import_csv` with `content` and `filename` only (no account_name/type — let auto-detection work)
      3. Handle response:
         - `success` → report results
         - `duplicate` → skip, mention already imported
         - `unknown_account` → show sample transactions, ask user which account, call `finance_register_fingerprint`, then re-import with explicit account
         - `error` → report error

      ### Step 3 — Report

      Summary per file: filename, account, imported/duplicates, categorised/uncategorised.
      Then call `finance_summary` for overall coverage.
      If uncategorised transactions exist, offer to review them.

      ## Known Accounts
      - AIB: "AIB Current", "AIB Joint", "AIB Sam"
      - Revolut: "Revolut Alex", "Revolut Sam", "Revolut Joint"

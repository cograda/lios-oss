# Comar client configuration — example / spec.
#
# Real config lives at ~/.config/comar/config.toml (gitignored, per-machine).
# This file is committed as the canonical reference for what fields exist.
#
# The simplest way to produce a real config from this template is:
#   bash scripts/setup-machine.sh
# which runs `comar setup --noninteractive` and fills in the values for you.
# You can also write ~/.config/comar/config.toml by hand — copy this file and
# replace the placeholders.

# Which user this client is operating as. Drives per-user data scoping on
# the server (Alex = user_id 1, Sam = user_id 2). Lowercase.
user = "alex"

# Local health-check port the daemon listens on (GET /health only — the
# daemon retired its local MCP server in Phase 4, 2026-07-14). Claude Code
# and every other MCP consumer talk straight to the remote server's /mcp/
# and never touch this port. `health_port` is accepted as an alias; the
# legacy `mcp_port` key name still works so existing configs don't need
# updating. Default 9400.
mcp_port = 9400

# Whether the daemon should auto-update its wheel from the server when a
# newer version is published. Safe to leave on for personal machines.
auto_update = true

[server]
# Ordered preference list of comar-server base URLs. The client probes each in
# turn at connect time and uses the first that answers an *authenticated*
# GET /api/v1/heartbeat with 200 — reachability alone is not enough, because
# 192.168.1.x is a common enough subnet that a foreign network's router or
# printer will happily answer on that address.
#
# LAN first (no WireGuard hop), Tailscale second (works anywhere the tailnet
# is up). The daemon re-resolves on every reconnect, and its 5-minute heartbeat
# moves back to the first entry once it's reachable again — so a laptop that
# leaves the house and comes back needs no reconfiguration.
#
# A single-entry list skips probing altogether and behaves exactly as before.
urls = [
  "http://192.168.1.50:8400",
  "https://ubuntudockerbox.tail78010b.ts.net",
]

# Legacy single-URL form. Still accepted by the config loader; equivalent to a
# one-entry `urls` list.
# url = "http://192.168.1.50:8400"

# Per-user bearer token. Look it up in the server's `client_tokens` table
# (one row per (user_id, machine)). NEVER commit a real token.
token = "REPLACE_ME_WITH_PER_USER_BEARER_TOKEN"

# Optional CA cert path — only needed if you front the server with a
# self-signed TLS cert. LAN HTTP deployments leave this unset.
# ca_cert = "/Users/<you>/.config/comar/ca.crt"

[vault]
# Absolute path to the Obsidian vault on this machine. The daemon's fsevents
# watcher pushes changes from here to the server for re-indexing.
path = "/Users/alexrivers/Desktop/Code/lios/vault"

[alerts]
# Off-box "server silent" detector. Every other household monitor (Pulse,
# uptime-kuma, Home Assistant, lios core's own system_alerts) runs ON the
# Proxmox cluster — if the cluster or its docker host dies, none of them can
# push a warning. This Mac's daemon is the one thing that's always on and off
# that infrastructure, so it raises a local macOS notification instead.
#
# Minutes the server must be unreachable (and this Mac's own network must be
# fine, and the token must not simply be invalid) before the first local
# notification fires. 0 disables the detector entirely.
server_silent_minutes = 20

# While still silent, don't re-notify more often than this many hours.
server_silent_refire_hours = 6

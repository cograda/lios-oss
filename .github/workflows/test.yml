name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: comar
          POSTGRES_PASSWORD: comar
          POSTGRES_DB: comar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # conftest prefers this over spinning testcontainers — the db tier
      # runs against the service container.
      COMAR_TEST_DATABASE_URL: postgresql+psycopg2://comar:comar@localhost:5432/comar_test
    steps:
      - uses: actions/checkout@v4

      - name: Check vendored coglib stamp
        # CI can't see coglib's upstream repo (separate monorepo), so this only
        # checks that the stamp file exists and isn't stale — it never fails
        # the build, just warns.
        run: |
          stamp=server/coglib/.vendored-commit
          if [ ! -f "$stamp" ]; then
            echo "::warning::$stamp is missing — coglib vendoring stamp not found. Run 'make refresh-coglib' in server/ after vendoring."
            exit 0
          fi
          stamp_date=$(sed -n '2p' "$stamp")
          stamp_epoch=$(date -u -d "$stamp_date" +%s 2>/dev/null || echo 0)
          now_epoch=$(date -u +%s)
          age_days=$(( (now_epoch - stamp_epoch) / 86400 ))
          if [ "$stamp_epoch" -eq 0 ]; then
            echo "::warning::$stamp has an unparsable date ($stamp_date) — coglib vendoring stamp may be corrupt."
          elif [ "$age_days" -gt 90 ]; then
            echo "::warning::$stamp is $age_days days old (>90) — coglib may be stale, consider running 'make refresh-coglib'."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/backend/requirements.txt
            server/backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install ./server/coglib
          pip install -r server/backend/requirements.txt -r server/backend/requirements-dev.txt

      - name: Run server tests (unit + db tiers)
        run: python -m pytest tests/ -q
        working-directory: server/backend

  client-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: client/pyproject.toml

      - name: Install client with test deps
        run: pip install -e './client[test]'

      - name: Run client tests
        run: python -m pytest tests/ -q
        working-directory: client

name: daily_note
title: "Morning Daily Note"
description: "Create today's daily note with calendar, health, email, WhatsApp, reminders, music, and task carry-forward. The primary morning planning workflow."
arguments:
  - name: user
    description: "Whose note to create: alex or sam (default: alex)"
    required: false
  - name: notes
    description: "Optional context or notes for the day (e.g. 'feeling rough today, need to focus on the tax return')"
    required: false
messages:
  - role: user
    content: |
      Create today's daily note for {{ user }}.

      {{ notes }}

      ## Output contract (read this before doing anything)

      You owe the user TWO things, in this order:

      1. A morning briefing in chat with EVERY one of these sections, in this order:
         **System Status · Weather · Calendar · Health · Reminders · Email · WhatsApp · Listening · Carried tasks**
         If any section's data is empty, write "Nothing to flag" under that heading. **Do not omit a heading. Do not invent headings that aren't in this list (e.g. no Coffee section).** A briefing missing any of the nine headings is a failed run, regardless of how thorough the included sections are.

      2. The note saved to the vault via `Write`.

      To get the data for those nine sections you must call all of these tools, in parallel, before writing any text to the user:
      `system_alerts`, `calendar_today`, `weather_current`, `weather_forecast`, `reminders_list`, `gmail_unread`, `gmail_recent`, `whatsapp_recent`, `health_summary`, `health_trends`, `lastfm_recent`, `lastfm_stats`.

      Twelve tools, one parallel batch. Do not narrate "let me fetch the data" first. Do not skip any tool because a section "feels light today" — the user wants every check visible. The five tools most often skipped (and which you must double-check you called) are: **`system_alerts`, `whatsapp_recent`, `lastfm_recent`, `lastfm_stats`, `health_trends`**.

      Then read the previous daily notes (separate step, see below) for carry-forward.

      ## Steps

      ### 1. Determine date, user, and lookback window

      - Today's date and day of the week
      - Default user: Alex (`vault/Daily Notes/Alex/YYYY-MM-DD.md`)
      - **Lookback window**: Calculate how far back to pull context:
        - **Monday**: back to Friday (3 days) — cover the full weekend
        - **Saturday or Sunday**: back to Friday (1-2 days)
        - **Tue–Fri**: 48 hours (2 days)
        - Use the lookback start date for WhatsApp, email, and previous daily notes

      ### 2. Check if note exists

      - Use `Read` to check if the note exists
      - If it exists, show current contents and ask what to update
      - If it doesn't exist, create it (continue to step 3)

      ### 3. Fetch data (MCP tools)

      **Critical: call ALL 12 of the tools below in parallel in a single message before writing any text to the user.** Do not narrate "let me fetch the data" first. Do not call them sequentially. Do not skip any — even if a section feels low-value today, you cannot judge that without the data. Skipping `system_alerts`, `whatsapp_recent`, `lastfm_recent`, `lastfm_stats`, or `health_trends` is the most common failure mode of this prompt; those five are required, not optional.

      **Core context:**
      - **`system_alerts`** — REQUIRED, check first; integration health (failing/stale syncs)
      - **`calendar_today`** — today's events
      - **`weather_current`** — current conditions
      - **`weather_forecast`** — today's high/low
      - **`reminders_list`** — all incomplete reminders

      **Comms (use lookback window):**
      - **`gmail_unread`** — unread emails (limit: 10)
      - **`gmail_recent`** with `{"limit": 50}` — last 50 emails (covers full lookback window)
      - **`whatsapp_recent`** with `{"limit": 50}` — REQUIRED; recent WhatsApp across all chats

      **Health:**
      - **`health_summary`** — pre-formatted health snapshot (steps, sleep, HR, workouts)
      - **`health_trends`** with `{"days": 7}` — REQUIRED; weekly trends so the snapshot has context

      **Music:**
      - **`lastfm_recent`** with `{"limit": 15}` — REQUIRED; what's been playing recently
      - **`lastfm_stats`** with `{"period": "this_week"}` — REQUIRED; weekly top artists + genres

      **Task carry-forward (separate, after the parallel batch):**
      Read previous daily notes covering the full lookback window (same user). On Mon–Fri read at least 2 previous notes; on Monday read back to Friday (up to 4 notes). Always read up to 7 previous daily notes if needed — stop reading further back once you hit a note where all Focus items are completed.

      **Verification before moving on:** Confirm you ran all 12 tools listed above. If you find you skipped one (most often `system_alerts`, `whatsapp_recent`, `lastfm_recent`, `lastfm_stats`, or `health_trends`), call it now. Do not proceed to step 4 with missing data.

      If any MCP tool returns an error, note the error but continue with the data you have. Do not silently omit a section — show "⚠️ [tool] unavailable" instead. A tool returning empty data (e.g. no WhatsApp messages in the window) is NOT an error; render the section with "Nothing actionable" rather than dropping it.

      ### 4. Process all data

      Now process the fetched data into the morning briefing sections:

      **System Alerts:**
      - If status is "all_ok", skip this section entirely
      - If status is "degraded", list each alert: `⚠️ **integration**: issue description`

      **Calendar:**
      - `HH:MM  Event title` for timed events
      - `ALL DAY  Event title` for all-day events
      - Events are pre-filtered by the server (hidden calendars excluded, work events show as "(busy)")

      **Weather:**
      - Combine current + forecast into a one-liner: `☁️ 12°C, cloudy, high 14°C / low 8°C, light rain expected`

      **Reminders:**
      - **Overdue** (due_date before today): show each item with title and how overdue it is
      - **Due today**: show each item with title
      - **High priority** (priority = high or urgent, no due date): show each item
      - Skip the "Groceries" list unless there are overdue items in it
      - Skip completed items
      - Cap at 15 items total — if more, show the count of remaining

      **Email digest:**
      - **Unread**: sender and subject for each unread message
      - **Recent (lookback window)**: scan the recent emails for anything noteworthy — actionable items, things requiring a reply, important updates. Skip newsletters, automated notifications, and marketing. Summarise each in one line.
      - Group by account if multiple accounts
      - On Mondays, be thorough — weekend emails often contain things that need action

      **WhatsApp digest:**
      - Skip casual chat, memes, group banter
      - Surface: plans being made, questions asked of Alex/Sam, decisions needed, logistics (pickups, appointments, tradespeople), anything time-sensitive
      - For each: **contact/group** — one-line summary of what needs attention
      - If nothing actionable, say "Nothing actionable in recent WhatsApp"
      - On Mondays, cover the full weekend

      **Health snapshot:**
      - Today/yesterday: steps, distance, active energy, sleep (total + quality breakdown), resting HR
      - Week trends: are steps up or down vs the 7-day average? Sleep improving or declining? Any notable HR/HRV changes?
      - Keep it to 3-4 lines. Tone: informative and motivating, not clinical.
      - Example: `🏃 8,432 steps yesterday (avg 7,200/day this week, trending up). Slept 7h12m (1h22m deep, 1h45m REM — solid). Resting HR 58bpm, HRV 42ms.`

      **Music:**
      - One-liner about recent listening: what's been on heavy rotation, any new discoveries
      - Keep to 1-2 lines. Skip if no data or nothing interesting to say.
      - Example: `🎵 Big week for Radiohead (12 plays) and Floating Points. Mostly electronic/ambient — winding-down music.`

      **Carry forward from recent days:**
      - Uncompleted Focus items from any day → move to today's Active
      - Uncompleted Active items from any day → carry to today's Active (preserve grouping)
      - Skip anything marked done (has `[x]`)
      - If an item appears in multiple days (carried repeatedly), only include it once
      - For items carried from 3+ days ago, add "(stalled Xd)" after the item
      - Meeting action items that weren't completed → carry forward

      ### 5. Opinions & Flags

      After processing all data, analyze for these patterns and flag them:

      - **Sleep + schedule conflict**: If sleep was poor (<6h or <30min deep) AND today has >3 meetings, flag: "Heads up: rough sleep + packed day"
      - **Movement trends**: If steps are trending down >20% week-over-week, mention it
      - **Email pile-up**: If unread count is >10, or if there are emails >48h old without response, flag them
      - **Reminder overload**: If >5 items are overdue, highlight the oldest 3
      - **Weather impact**: If rain is expected and there are outdoor calendar events, note the conflict

      ### 6. Create the note

      Use `Write` to create the note at the correct path:

      ```markdown
      ---
      date: YYYY-MM-DD
      type: daily
      ---

      # DayName, D Month YYYY

      << [[YYYY-MM-DD]] | [[YYYY-MM-DD]] >>

      > ☁️ Weather one-liner

      > ⚠️ **integration**: issue (only if alerts present, omit block otherwise)

      ## Today

      - HH:MM  Event title
      - ...

      ## Tasks

      ### Overdue

      \```tasks
      not done
      has due date
      due before YYYY-MM-DD
      \```

      ### Due Today

      \```tasks
      not done
      due on YYYY-MM-DD
      \```

      ### Focus



      ### Active

      **Household**
      - carried items...

      **Personal**
      - carried items...

      ## Health

      health snapshot...

      ## Email

      - actionable items from lookback window...

      ## WhatsApp

      - actionable items from recent messages...

      ## Listening

      music one-liner...

      ## Meetings

      ## Notes
      ```

      If user notes were provided (the "notes" argument), add them to the Notes section and factor them into Focus suggestions.

      ### 7. Present the briefing

      Use these exact nine headings, in this order. Every heading appears in every run, even on a quiet day. If a section has no data, write "Nothing to flag" under it. Do not invent additional headings (e.g. no Coffee, no Listening Stats vs Listening — pick one heading per topic and stick to it).

      ```
      ## System Status
      <one line per alert with ⚠️, or "All integrations green">

      ## Weather
      <one-liner: e.g. "☁️ 12°C now, cloudy, high 14°C / low 8°C, light rain expected">

      ## Calendar
      <bulleted events with times, or "Clean day">

      ## Health
      <3-4 lines: today's snapshot from health_summary, then the 7-day trend
      interpretation from health_trends. NOT just today — both. If trend tool
      errored, say so.>

      ## Reminders
      <overdue + due-today items by name; cap 15>

      ## Email
      <unread + anything actionable from the lookback window>

      ## WhatsApp
      <plans, questions, decisions needed across recent chats, or
      "Nothing actionable in recent WhatsApp">

      ## Listening
      <one or two lines from lastfm_recent + lastfm_stats; if both empty,
      "No recent listening data">

      ## Carried tasks
      <what rolled over from previous daily notes; "None" if nothing>
      ```

      Then below the briefing add any **Opinions & flags** from step 5 (sleep+schedule conflict, movement trends, etc.).

      A run that omits any of the nine headings has failed the contract — even if the included sections are excellent. Trimming sections is a regression, not a stylistic choice.

      ### 8. Task Reconciliation

      Present ALL potential tasks from ALL sources in a single table for triage:

      | # | Task | Source | Due | Priority | Action |
      |---|------|--------|-----|----------|--------|
      | 1 | Example task | Reminder | today | high | keep / discard / edit |
      | 2 | Reply to X | Email | none | medium | keep / discard / edit |

      Sources: Reminders (overdue + due today), actionable emails, WhatsApp items needing a response, carried tasks from previous days.

      Ask the user to triage: which to keep, discard, edit, or assign priority.
      For kept items, ask which go to Focus (3-5 max).

      ### 9. Sync decisions

      After the user triages, for each kept item:
      - If it should be a Reminder: call `reminders_add` with appropriate due date and priority
      - If it should be in the backlog: call `Edit` to add to the appropriate backlog file
      - Far-out items may need both a reminder AND a calendar entry suggestion

      Tell the user: "Run the lock_in prompt when you've decided your focus items — it'll sync them to Reminders."

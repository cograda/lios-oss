name: quick_capture
title: "Quick Capture"
description: "Capture a task, note, or question and route it to the right place"
arguments:
  - name: input
    description: "What you want to capture or ask about"
    required: true
messages:
  - role: user
    content: |
      Quick capture: {{ input }}

      Determine what the input is and route it to the right place. Do not ask clarifying questions unless genuinely ambiguous — just do the sensible thing.

      ## Routing logic

      ### If it's a task (something that needs doing)

      1. Determine placement:
         - Personal task -> add to the unified `vault/Task Backlog.md` under the right domain heading
         - Otherwise -> `vault/Task Backlog.md` (default)

      2. Read the target backlog with `Read` to find the right section.

      3. Format in Obsidian Tasks format:
         ```markdown
         - [ ] Task description 🔼 📅 2026-04-15 #tag
         ```
         Priority emojis: 🔺 urgent, ⏫ high, 🔼 medium (default), 🔽 low.
         Only include the date emoji if a due date was mentioned.
         Use `[[wiki links]]` for people and entities.

      4. Add to the appropriate section using `Edit`.

      5. If the task is time-sensitive (has a due date or is urgent/high priority), also create a reminder using `reminders_add` with the appropriate due date and priority.

      6. Confirm what was added and where.

      ### If it's a question about data

      Use the relevant MCP tools to answer:
      - Email questions -> `gmail_search` or `gmail_recent`
      - WhatsApp questions -> `whatsapp_search` or `whatsapp_recent`
      - Vault/note questions -> `Grep` or `vault_search`
      - Calendar questions -> `calendar_today` or `calendar_list_events`
      - Finance questions -> `finance_summary`, `finance_transactions`, etc.
      - Weather questions -> `weather_current`, `weather_forecast`
      - Train questions -> `rail_next`, `rail_departures`
      - Music questions -> `lastfm_recent`, `lastfm_stats`
      - Reminder questions -> `reminders_list`

      Answer concisely with the data found.

      ### If it's a note (information to record)

      1. Determine the best location:
         - About Finn or Isla -> `vault/Household/Kids/Finn/` or `vault/Household/Kids/Isla/`
         - About the house, car, renovation -> appropriate `vault/Household/` subfolder
         - A person -> `vault/People/`
         - Reference/how-to -> `vault/Reference/Guides/` or `vault/Reference/Research/`
         - Personal -> `vault/Notes/`
         - If it fits better as an addition to an existing note, append to that note instead of creating a new one

      2. Check if a relevant note already exists using `Grep`. If so, append using `Edit`.

      3. If creating a new note, use `Write` with proper frontmatter:
         ```markdown
         ---
         title: "Note Title"
         type: note
         created: YYYY-MM-DD
         modified: YYYY-MM-DD
         tags: [relevant-tags]
         ---
         ```

      4. Use `[[wiki links]]` for people and entities.

      5. Confirm what was created/updated and where.

      ## Response style

      Keep it brief. Confirm what you did in 1-2 lines. This is a quick capture, not a conversation.

name: import_finance
title: "Import Finance"
description: "Import CSV bank statements from the csv-inbox folder into the finance system"
arguments:
  - name: filter
    description: "Optional filter for which CSVs to import (e.g. 'aib' or 'revolut')"
    required: false
messages:
  - role: user
    content: |
      Import CSV bank statements into the finance system.

      Filter: {{ filter }}

      ## Process

      ### Step 1 — Find CSVs

      Look for CSV files in the inbox folder: `server/csv-inbox/`

      If no CSVs found, tell the user to drop CSV files there and re-run.

      If a filter was provided (e.g. "aib" or "revolut"), only process matching files.

      ### Step 2 — Identify each file

      For each CSV file:
      1. Read the first few lines to identify the format (AIB or Revolut)
      2. Infer the account name from the filename or content:
         - Filenames containing "aib" or "AIB" -> account type "AIB"
         - Filenames containing "revolut" or "Revolut" -> account type "Revolut"
         - If unclear, ask the user
      3. Suggest an account name based on the type:
         - AIB files -> "AIB Current" (or "AIB Joint" if joint account)
         - Revolut files -> "Revolut Alex" (or "Revolut Sam")
         - If unclear, ask the user

      ### Step 3 — Import

      For each CSV file, call the `finance.import_csv` MCP tool with:
      - `content`: the full CSV file content
      - `filename`: the original filename
      - `account_name`: the identified account name
      - `account_type`: "AIB" or "Revolut"

      ### Step 4 — Report

      Show a summary for each file:
      - Filename
      - Account
      - Transactions imported / duplicates skipped
      - Categorised / uncategorised

      Then show the overall categorisation coverage by calling `finance_summary`.

      If there are uncategorised transactions, suggest running `finance_uncategorized` to see what needs rules.

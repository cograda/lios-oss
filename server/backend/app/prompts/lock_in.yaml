name: lock_in
title: "Lock In Focus"
description: "Lock in today's focus items and sync with Apple Reminders"
arguments:
  - name: focus_items
    description: "Comma-separated focus items for today (e.g. 'tax return, finn school form, call plumber')"
    required: false
  - name: user
    description: "Whose daily note to use: alex or sam (default: alex)"
    required: false
messages:
  - role: user
    content: |
      Lock in today's focus and sync with Apple Reminders.

      Focus items: {{ focus_items }}
      User: {{ user }}

      Run this after the daily note has been created. The daily note should already exist with Active items carried over.

      ## Steps

      ### 1. Read today's daily note

      Read `vault/Daily Notes/Alex/YYYY-MM-DD.md` (use today's date).

      If the note doesn't exist, tell the user to run the daily_note prompt first.

      ### 2. Check for Focus items

      Look at the `### Focus` section. If the user has already filled it in (either manually in Obsidian or via the focus_items argument), use those items. If it's empty, ask the user what they want to focus on today — suggest candidates from Active, Due Today, and any actionable items from Email/WhatsApp/Health sections.

      If focus_items were provided (e.g. "tax return, finn school form, call plumber"), parse those as the focus list.

      ### 3. Update the daily note

      Write the chosen Focus items into the `### Focus` section using `Edit`:
      ```markdown
      ### Focus

      - [ ] Focus item 1
      - [ ] Focus item 2
      - [ ] Focus item 3
      ```

      Cap at 5 items. If the user lists more, ask them to prioritise.

      ### 4. Fetch reminder and backlog data

      Call the `reminders_list` MCP tool to get all incomplete reminders with their titles, lists, due dates, and priorities.

      Also read the backlog using `Read`:
      - `vault/Task Backlog.md`

      ### 5. Sync analysis

      Using the reminders data and backlog contents, perform a sync analysis:

      **Fuzzy match:**
      For each reminder, find the closest matching backlog task (case-insensitive, partial match, ignore emoji/dates). Score as:
      - **Match**: reminder clearly corresponds to a backlog item
      - **Reminder only**: exists in Reminders but not in any backlog
      - **Backlog only**: exists in backlog but not in Reminders

      **Report:**
      Produce three lists:
      1. **Matched** — reminder <-> backlog pairs (no action needed)
      2. **In Reminders, not in backlog** — suggest adding to appropriate backlog
      3. **In backlog, not in Reminders** — suggest creating reminders for high-priority items (urgent and high only)

      Also flag any Focus items from today that don't have a corresponding reminder.

      ### 6. Present sync results

      Show the sync report. For each gap:
      - **Reminder -> Backlog**: "Add 'X' to shared/personal backlog?"
      - **Backlog -> Reminder**: "Create reminder for 'X'?"
      - **Focus without reminder**: "Sync 'X' to Reminders for today?"

      ### 7. Execute sync actions

      For items the user approves:
      - **Add to backlog**: Append task to the appropriate backlog file with sensible priority using `Edit`
      - **Create reminder**: Call the `reminders_add` MCP tool with the task title, list name, and due date
      - **Complete reminder**: Call the `reminders_complete` MCP tool for any done items still showing in Reminders

      ### 8. Confirm

      Tell the user they're locked in. Show their Focus list and any sync actions taken. Keep it brief — they want to start working.

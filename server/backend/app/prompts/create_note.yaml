name: create_note
title: "Create Note"
description: "Create a new note with proper frontmatter and placement in the vault"
arguments:
  - name: topic
    description: "What the note is about (e.g. 'How to reset the Hive heating schedule', 'Finn school report')"
    required: true
messages:
  - role: user
    content: |
      Create a new note with proper frontmatter.

      Topic: {{ topic }}

      ## Steps

      1. Parse the note topic from the input. If no topic provided, ask what the note is about.

      2. Determine the note type and location:
         - How-to or guide -> `type: reference`, `vault/Reference/Guides/`
         - Research or comparison -> `type: reference`, `vault/Reference/Research/`
         - About Finn or Isla -> `type: note`, `vault/Household/Kids/Finn/` or `vault/Household/Kids/Isla/`
         - About the house, car, renovation -> `type: note`, appropriate `vault/Household/` subfolder
         - A person (tradesperson, friend, professional) -> `type: note`, `vault/People/`
         - A project or initiative -> `type: note`, `vault/Projects/`
         - Personal thought or reflection (Alex) -> `type: note`, `vault/Notes/`
         - Genuinely unsure -> `type: note`, `vault/Household/` with best-guess subfolder

      3. Create the note with appropriate frontmatter, tags, and links to hub notes using `Write`.

         Frontmatter template:
         ```markdown
         ---
         title: "Note Title"
         type: note
         created: YYYY-MM-DD
         modified: YYYY-MM-DD
         tags: [relevant-tags]
         ---
         ```

         For reference notes, use `type: reference` instead.

         For people notes, include `tags: [person]` and optionally role/context tags.

      4. If the user included content in their topic description, write it as the note body. Otherwise, create the skeleton and let them know where it is.

      5. Filename should be a readable title: spaces allowed, no special chars that break filesystems.

      6. Use `[[wiki links]]` for people and hub entities mentioned in the note.

      ## Examples

      - "How to reset the Hive heating schedule" -> `vault/Reference/Guides/How to reset the Hive heating.md`
      - "Finn's school report" -> `vault/Household/Kids/Finn/School Report.md`, links: [[Finn]]
      - "Niall" -> `vault/People/Niall.md`, tags: [person, renovation]
      - "Comparing solar panel installers" -> `vault/Reference/Research/Solar Panel Installers.md`

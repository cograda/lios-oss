[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coglib"
version = "0.1.0"
description = "Shared Python utilities: config, database, logging, LLM calls"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    # coglib.llm talks to all three providers over plain HTTP rather than
    # pulling in anthropic/openai/google-genai. coglib is vendored into
    # deployed images, so a dependency here is a dependency everywhere.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/coglib"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
